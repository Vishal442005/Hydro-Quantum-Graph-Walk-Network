[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hqgwn"
version = "1.1.0"
description = "Hydro-Quantum Graph Networks: Navier-Stokes Vorticity, Open-System Lindblad Quantum Walks, and Von Neumann Entropy Collapse"
readme = "README.md"
authors = [
    { name = "Vishal Chandel", email = "vishal442005@outlook.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "pandas>=1.5.0",
]

[tool.setuptools.packages.find]
include = ["hqgwn*"]

[project.urls]
"Homepage" = "https://github.com/Vishal442005/Hydro-Quantum-Graph-Walk-Network"
"Repository" = "https://github.com/Vishal442005/Hydro-Quantum-Graph-Walk-Network"
"ORCID" = "https://orcid.org/0009-0006-0552-8551"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.1445760922"
